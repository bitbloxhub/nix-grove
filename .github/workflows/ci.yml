# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  check:
    name: Nix checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Free disk space for Nix
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: rampage
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
      - name: Cache Nix builds
        uses: Mic92/hestia@v3.0.0
      - name: Load dev environment
        run: |
          nix shell --inputs-from . nixpkgs#direnv -c bash -c '
            direnv allow
            direnv export gha >> "$GITHUB_ENV"
          '
      - name: Run Nix checks
        run: junix check --eval-arch x86_64-linux -o report.xml
      - if: success() || failure()
        name: Upload JUnit report
        uses: dorny/test-reporter@v3.0.0
        with:
          fail-on-error: "true"
          name: Nix Build Results
          path: report.xml
          reporter: java-junit
          use-actions-summary: "true"
name: CI
"on":
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
